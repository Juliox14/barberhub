<!doctype html>
<html lang="es">
<head>

    <title>Sin conexión · BarberHub</title>
    <style>
        :root { color-scheme: dark; font-family: Figtree, system-ui, sans-serif; background: #0b1118; color: #f1f5f9; }

        main { width: min(100%, 30rem); border: 1px solid #334155; border-radius: 1rem; background: #111820; padding: 2rem; box-sizing: border-box; }

        h1 { margin: 1.5rem 0 .75rem; font-size: clamp(1.6rem, 7vw, 2.2rem); }
        p { color: #cbd5e1; line-height: 1.65; }
        strong { color: #fcd34d; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-label="BarberHub">BH · BARBERHUB</div>
        <h1>No hay conexión a internet</h1>
        <p>Conéctate para volver a usar BarberHub. <strong>La agenda y las citas no están disponibles sin conexión.</strong></p>
        <p>No se guardó ni se envió ninguna operación. Cuando recuperes la conexión, vuelve a cargar la página.</p>
    </main>

</html>
